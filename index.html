<!doctype html>
<!-- data-theme on the element rather than from an inline script. The build injects a CSP of
     script-src 'self' with no unsafe-inline, so an inline script is refused outright; the page's
     privacy guarantee is worth more than a first-paint nicety for returning visitors who picked
     a different palette. -->
<html lang="en" data-theme="twilight-comet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>decoder - paste anything, find out what it is</title>
<meta name="description" content="One box. Paste a token, a hash, a timestamp, an encoded blob, and it says what it is and what is inside it. Nothing leaves your browser, and the page cannot reach the network at all.">
</head>
<body class="grain"><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
